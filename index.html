<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Ledger Deck</title>
<meta name="description" content="A free, private money dashboard for Australians. Personal and business books, tax help and plain-English briefings. Your data stays on your device.">
<meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledger Deck">
<link rel="stylesheet" href="css/app.css">
<link rel="modulepreload" href="js/app.js">
</head>
<body>
<a class="skip" href="#root">Skip to content</a>
<div class="app">
  <nav class="rail" aria-label="Screens">
    <div class="brand"><i aria-hidden="true"></i>Ledger Deck</div>
    <button class="nav" type="button" data-view="briefing"><svg viewBox="0 0 24 24"><path d="M3 12h3l2.5-6 4.5 13 3-9 2 2h3"/></svg>Briefing<span class="k">1</span></button>
    <button class="nav" type="button" data-view="personal"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Personal<span class="k">2</span></button>
    <button class="nav" type="button" data-view="business"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg>Business<span class="k">3</span></button>
    <button class="nav" type="button" data-view="tax"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Tax<span class="k">4</span></button>
    <button class="nav" type="button" data-view="whatif"><svg viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>What if<span class="k">5</span></button>
    <button class="nav" type="button" data-view="data"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Data &amp; AI<span class="k">6</span></button>
    <div class="foot"><b>Free and open source.</b> Your data stays on this device.<br><span class="kbd">1</span>–<span class="kbd">6</span> screens · <span class="kbd">A</span> ask · <span class="kbd">H</span> hide numbers<br><a href="privacy.html" target="_blank" rel="noopener" style="color:inherit">Privacy</a></div>
  </nav>
  <main>
    <header class="top">
      <h1 id="title">Briefing</h1>
      <span class="chip local" title="Everything is stored in this browser on this device"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>On this device</span>
      <button class="chip btn" type="button" id="aiChip" data-go="data"><span class="dotc"></span><span id="aiChipT">AI not connected</span></button>
      <span class="sample" id="sampleTag" hidden>SAMPLE DATA</span>
      <div class="fy" id="fy"><div class="bar"><span id="fybar"></span></div><span id="fytext"></span></div>
      <button class="chip btn" type="button" id="privacy" aria-pressed="false">Hide numbers</button>
    </header>
    <div id="root"><p class="hint" style="padding:40px 0">Loading…</p></div>
  </main>
</div>
<div id="tip" role="tooltip"></div>
<div class="sheet-bg" id="sheetBg"></div>
<aside class="sheet" id="sheet" aria-hidden="true" role="dialog" aria-labelledby="sheetT"><div class="sheet-h"><h3 id="sheetT"></h3><button class="mini" type="button" id="sheetX" aria-label="Close">✕</button></div><div class="sheet-b" id="sheetB"></div></aside>
<button class="fab" type="button" id="askFab" aria-label="Ask about your finances"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Ask</button>
<aside class="ask" id="ask" aria-label="Ask about your finances" aria-hidden="true">
  <div class="ask-h"><h2>Ask<small id="askWho">Uses the AI you connect</small></h2><button class="mini" type="button" id="askClear">New chat</button><button class="mini" type="button" id="askClose" aria-label="Close">✕</button></div>
  <div class="ask-log" id="askLog"></div>
  <div class="ask-opts"><label><input type="checkbox" id="askSpeak"> Read answers aloud</label><span id="askNote"></span></div>
  <form class="ask-in" id="askForm">
    <button type="button" class="iconbtn" id="askMic" aria-label="Speak your question"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12z"/></svg></button>
    <textarea id="askIn" rows="1" placeholder="Ask about your money…"></textarea>
    <button type="submit" class="iconbtn send" id="askSend" aria-label="Send"><svg viewBox="0 0 24 24" id="sendIcon"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg></button>
  </form>
</aside>
<div id="wizRoot"></div>
<div id="lockRoot"></div>
<noscript><p style="padding:24px">Ledger Deck needs JavaScript to run. Everything runs in your browser; nothing is sent to a server.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
